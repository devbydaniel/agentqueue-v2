# Template variables:
# . — package directory (e.g., "." for single-package, "backend" for monorepo)
# {{TEST_CMD}} — "vitest run" for simple, "jest" for medium/high
# {{HAS_DATABASE}} — include postgres service container if true
# {{HAS_DEPS_CHECK}} — include deps:check step for medium/high

name: Lint & Test

on:
  pull_request:
    paths:
      - './src/**'
      - './package*.json'
      - '.github/workflows/lint-and-test.yml'
  push:
    branches: [main]
    paths:
      - './src/**'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci


      - name: Run tests
        run: npm test
