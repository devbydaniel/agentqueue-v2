services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://agentqueue:agentqueue@postgres:5432/agentqueue
    volumes:
      - ${AGENTFILES_CONFIG:-~/.config/agentfiles}:/home/app/.config/agentfiles:ro
      - ${AGENTQUEUE_CONFIG:-~/.agentqueue}:/home/app/.agentqueue:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentqueue
      POSTGRES_PASSWORD: agentqueue
      POSTGRES_DB: agentqueue
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentqueue']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
